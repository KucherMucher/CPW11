<!DOCTYPE html>
<html lang="pt">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Lista de Tarefas Dinâmica</title>
        <link rel="stylesheet" href="styles.css">
        <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" rel="stylesheet">
    </head>
    <body>
        <div class="container">
            <header class="app-header">
                <h1><i class="fas fa-tasks"></i> Minhas Tarefas</h1>
                <p>Gerencie suas tarefas de forma eficiente</p>
            </header>

            <main class="app-main">
                <section class="input-section">
                    <div class="input-group">
                        <input type="text" id="task-input" placeholder="Digite uma nova tarefa..." maxlength="100">
                        <button id="add-button" class="btn btn-primary">
                            <i class="fas fa-plus"></i> Adicionar
                        </button>
                    </div>
                </section>

                <section class="filter-section">
                    <div class="filter-buttons">
                        <button class="filter-btn active" data-filter="all">Todas</button>
                        <button class="filter-btn" data-filter="pending">Pendentes</button>
                        <button class="filter-btn" data-filter="completed">Concluídas</button>
                    </div>
                </section>

                <section class="tasks-section">
                    <div id="tasks-container" class="tasks-container">
                        <!-- Tarefas serão inseridas aqui dinamicamente -->
                    </div>
                    <div id="empty-state" class="empty-state">
                        <i class="fas fa-clipboard-list"></i>
                        <p>Nenhuma tarefa encontrada</p>
                        <small>Adicione uma nova tarefa para começar</small>
                    </div>
                </section>

                <section class="stats-section">
                    <div class="stats-container">
                        <div class="stat-item">
                            <span class="stat-number" id="total-tasks">0</span>
                            <span class="stat-label">Total</span>
                        </div>
                        <div class="stat-item">
                            <span class="stat-number" id="completed-tasks">0</span>
                            <span class="stat-label">Concluídas</span>
                        </div>
                        <div class="stat-item">
                            <span class="stat-number" id="pending-tasks">0</span>
                            <span class="stat-label">Pendentes</span>
                        </div>
                    </div>
                </section>
            </main>
        </div>

        <script src="script.js"></script>
    </body>
</html>
